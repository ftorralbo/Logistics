<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Carga</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<h1>CONTROL DE CARGA</h1>

<!-- BARRA DE FILTROS -->
<div class="filtrosBarra">
    <div>
        <label>Paquete:</label>
        <input type="text" id="busquedaPaquete" placeholder="Buscar paquete">
    </div>

    <div>
        <label>Estado:</label>
        <select id="filtroEstado">
            <option value="">Todos</option>
            <option value="cargado">Cargados</option>
            <option value="pendiente">Pendientes</option>
        </select>
    </div>

    <div>
        <label>Número:</label>
        <select id="filtroNumero">
            <option value="">Todos</option>
        </select>
    </div>

    <div>
        <label>Destino:</label>
        <select id="filtroDestino">
            <option value="">Todos</option>
        </select>
    </div>

    <div>
        <label>Fecha:</label>
        <select id="filtroFecha">
            <option value="">Todas</option>
        </select>
    </div>

    <div>
        <label>Pedido:</label>
        <select id="filtroPedido">
            <option value="">Todos</option>
        </select>
    </div>
</div>

<!-- MODAL LATERAL -->
<div id="modalOverlay">
    <div id="modalPanel">
        <button id="cerrarModal">Cerrar</button>
        <h2>Resultados</h2>
        <div id="listaResultados"></div>
    </div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="container">

    <div class="panelIzq">

        <input type="file" id="fileInput">
        <button class="importar" onclick="importar()">IMPORTAR</button>
        <button class="exportar" onclick="exportar()">EXPORTAR</button>

        <br>

        <input type="file" id="fileBackup">
        <button onclick="restaurar()">RESTAURAR HISTÓRICO</button>

        <h2>Pedidos</h2>
        <div id="pedidos"></div>

        <h2>Radar Logístico</h2>
        <div id="radar" class="radar"></div>

    </div>

    <div class="panelDer">
        <div id="pantallaPedido"></div>
    </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
